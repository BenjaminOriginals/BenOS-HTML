// confirmAction : tiny helper for "are you sure?" prompts — shows a Cancel/OK dialog and only runs
// `fn` if OK is clicked, used for anything destructive/disruptive enough to warrant confirmation
// (restart, shut down, log out).
function confirmAction(msg,fn){ showDialog({icon:'⚠️',title:msg,buttons:[{label:'Cancel'},{label:'OK',primary:true,onClick:fn}]}); }
// logOut : force-closes every open window (silent=true so onClose "unsaved changes" prompts don't
// block logging out), fades the desktop away, then shows the login screen again.
function logOut(){
  [...WM.windows.values()].forEach(w=>WM.close(w,true));
  $('#desktop').style.opacity='0';$('#menubar').style.display='none';$('#dock-wrap').style.display='none';
  setTimeout(()=>{ $('#desktop').style.display='none'; showLogin(); },600);
}
// restartOS : simulates a restart by closing all windows, resetting the booted flag, hiding the
// desktop chrome, and simply re-running boot() from scratch (no actual page reload needed since BenOS
// already reloads its state fresh from FS/DB every time boot() runs).
function restartOS(){
  [...WM.windows.values()].forEach(w=>WM.close(w,true));
  BENOS.booted=false;
  $('#desktop').style.display='none';$('#menubar').style.display='none';$('#dock-wrap').style.display='none';
  boot();
}
// shutdownOS : the "hard stop" — closes windows, then wipes the entire page body and replaces it with
// a plain "powered off" message and a manual reload link (unlike restartOS, this doesn't reboot itself).
function shutdownOS(){
  [...WM.windows.values()].forEach(w=>WM.close(w,true));
  document.body.innerHTML='<div style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:#444;font-size:20px">BenOS HTML Edition is now off. <span style=margin-left:8px;cursor:pointer;color:#888 onclick="location.reload()">⟳ Power On</span></div>';
}
// sleepScreen : dims the screen behind a black overlay that fades in, and wakes back up (fades out
// and removes itself) on the next click anywhere — a lightweight stand-in for a real sleep/wake cycle.
function sleepScreen(){
  const o=el('div'); o.style.cssText='position:fixed;inset:0;background:#000;z-index:9400;transition:opacity .6s;opacity:0;';
  document.body.appendChild(o); setTimeout(()=>o.style.opacity='1',15);
  o.onclick=()=>{ o.style.opacity='0'; setTimeout(()=>o.remove(),600); };
}
// lockScreen : re-shows the login screen without touching any open windows/state underneath — the
// desktop is still fully intact, just hidden behind the login UI until the user signs back in.
function lockScreen(){ showLogin(); $('#login').style.opacity='1'; $('#login').style.display='flex'; }
/* ===================================================================== */
/* DESKTOP EVENTS — global wiring                                          */
/* ===================================================================== */
// wireDesktopEvents : attaches every desktop-level (as opposed to per-window or per-app) event
// listener, all in one place: dismissing open menus/panels on an outside click, right-click menus for
// empty desktop space, the menu bar's icon buttons (Spotlight/notifications/wifi/control center),
// Spotlight's live search + keyboard navigation, global keyboard shortcuts (Ctrl+Space for Spotlight,
// Escape to close overlays, Cmd/Ctrl+W to close the focused window), drag-and-drop import of real
// files from the user's computer onto the desktop, keeping maximized windows sized to the viewport on
// browser resize, and (further below) an edge-drag helper.
function wireDesktopEvents(){
  // dismiss menus on click anywhere
  document.addEventListener('mousedown',e=>{
    if(!e.target.closest('.ctx-menu')) hideCtx();
    if(!e.target.closest('#notif-center')&&!e.target.closest('#mb-notif')&&$('#notif-center').classList.contains('open')) $('#notif-center').classList.remove('open');
    if(!e.target.closest('.desk-icon')&&!e.target.closest('.window')&&e.target.closest('#desktop')){ deskSel.clear(); $$('.desk-icon').forEach(x=>x.classList.remove('sel')); }
  });
  // desktop right-click
  $('#icon-layer').addEventListener('contextmenu',e=>{ if(e.target.closest('.desk-icon'))return; e.preventDefault(); desktopMenu(e.clientX,e.clientY); });
  $('#desktop').addEventListener('contextmenu',e=>{ if(e.target.closest('.window')||e.target.closest('.desk-icon'))return; e.preventDefault(); desktopMenu(e.clientX,e.clientY); });
  document.addEventListener('contextmenu',e=>{ if(e.target.closest('#menubar')||e.target.closest('#dock')) e.preventDefault(); });

  // menu bar right side
  $('#mb-spot').onclick=openSpotlight;
  $('#mb-notif').onclick=toggleNotifCenter;
  $('#nc-clear').onclick=()=>{ NOTES.length=0; renderNotifCenter(); };
  $('#mb-wifi').onclick=openWifiPanel;
  $('#mb-control').onclick=openControlCenter;

  // spotlight input
  $('#spot-input').addEventListener('input',e=>spotSearch(e.target.value));
  $('#spotlight').addEventListener('mousedown',e=>{ if(e.target.id==='spotlight')closeSpotlight(); });

  // global keyboard
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey && e.code==='Space'){ e.preventDefault(); $('#spotlight').style.display==='flex'?closeSpotlight():openSpotlight(); return; }
    if(e.key==='Escape'){ hideCtx(); if($('#spotlight').style.display==='flex')closeSpotlight(); }
    if($('#spotlight').style.display==='flex'){
      if(e.key==='ArrowDown'){e.preventDefault();spotMove(1);}
      if(e.key==='ArrowUp'){e.preventDefault();spotMove(-1);}
      if(e.key==='Enter'){ const n=spotItems[spotSel]; if(n){closeSpotlight();openNode(n);} }
    }
    if((e.metaKey||e.ctrlKey)&&e.key==='w'&&WM.focused){ e.preventDefault(); WM.close(WM.focused); }
  });

  // ---- drag & drop import from the real computer ----
  const dz=$('#desktop');
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';}));
  dz.addEventListener('drop',async e=>{
    e.preventDefault();
    if(e.target.closest('.window'))return; // windows handle their own
    if(!e.dataTransfer.files||!e.dataTransfer.files.length)return;
    await importFiles(e.dataTransfer.files,'desktop');
  });

  window.addEventListener('resize',()=>{ [...WM.windows.values()].forEach(w=>{ if(w.maximized){w.el.style.width=window.innerWidth+'px';w.el.style.height=window.innerHeight+'px';} }); });

  // Auto-hide-and-reveal the menu bar/dock while any window is maximized (macOS-style fullscreen
  // behavior): moving the mouse to the very top or bottom edge of the screen reveals the corresponding
  // bar, and after 1.5s without the mouse sitting back at an edge, both are hidden again.
  let edgeTimer=null;
  document.addEventListener('mousemove',e=>{
    const anyMax=[...WM.windows.values()].some(w=>w.maximized);
    if(!anyMax)return;
    if(edgeTimer)clearTimeout(edgeTimer);
    if(e.clientY<3){
      $('#menubar').classList.remove('mbar-hide');
    }else if(e.clientY>window.innerHeight-8){
      $('#dock-wrap').classList.remove('dock-hide');
    }
    edgeTimer=setTimeout(()=>{
      const anyMax2=[...WM.windows.values()].some(w=>w.maximized);
      if(!anyMax2)return;
      if(e.clientY>=3&&e.clientY<=window.innerHeight-8){
        $('#menubar').classList.add('mbar-hide');
        $('#dock-wrap').classList.add('dock-hide');
      }
    },1500);
  });
}

/* import a FileList into a target folder, persisting permanently.
   Called from every "drag files from your real computer into BenOS" drop zone. Small text files
   (<500KB) are read and stored as plain strings (readable/editable in TextEdit); everything else
   (images, audio, larger files) is stored as a base64 data URL instead, since that's the only way to
   preserve arbitrary binary content in this virtual FS. Continues past individual file failures
   (reporting each via benRecoverable) so one bad file doesn't abort the whole batch. */
async function importFiles(fileList, parentId){
  let count=0;
  for(const f of fileList){
    try{
      const kind=kindFromName(f.name,f.type);
      const asText = kind==='txt' && f.size<512000;
      const content = await readFileAs(f, asText?'text':'dataURL');
      const n=await FS.createFile(parentId, f.name, content, kind);
      n.size=f.size; n.mime=f.type; await FS.save(n);
      count++;
    }catch(err){ benRecoverable('Import failed: '+(err.message||err)); }
  }
  refreshAfterFS(parentId);
  if(count) notify('Files imported', count+' file'+(count>1?'s':'')+' added to '+FS.pathOf(parentId),'📥');
}
// readFileAs : promisified FileReader — reads a real browser File either as plain text ('text') or as
// a base64 data: URL (anything else), used by importFiles above.
function readFileAs(file,mode){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(r.error||new Error('read error'));
    if(mode==='text')r.readAsText(file); else r.readAsDataURL(file);
  });
}

/* ===================================================================== */
/* AUDIO SYSTEM — global volume manager                                    */
/* ===================================================================== */
// Audio$ : a tiny registry so the menu bar's master volume/mute control can affect every playing
// <audio>/<video> element at once (e.g. BenMusic playback), without each app having to poll BENOS
// state itself — apps just call Audio$.register(element) once and its volume stays in sync from then on.
const Audio$={
  elements:new Set(),
  register(a){ Audio$.elements.add(a); a.volume=BENOS.muted?0:BENOS.volume; },
  setVolume(v){ BENOS.volume=Math.max(0,Math.min(1,v)); BENOS.muted=false; Audio$.apply(); FS.setMeta('volume',BENOS.volume); FS.setMeta('muted',false); },
  toggleMute(){ BENOS.muted=!BENOS.muted; Audio$.apply(); FS.setMeta('muted',BENOS.muted); },
  apply(){ Audio$.elements.forEach(a=>{ try{a.volume=BENOS.muted?0:BENOS.volume;}catch(e){} }); },
};
/* ===================================================================== */
/* PREINSTALLED APP — FILES (Finder-style file manager)                    */
/* ===================================================================== */
// buildFilesApp : constructs a full Finder-like window — toolbar (back/forward/up, path, view toggle,
// search), a favorites sidebar, and a main pane that renders the current folder either as an icon grid
// or a detail list. Each Files window keeps its own independent navigation state (cwd/history/hpos)
// via closures, so multiple Files windows can browse different folders simultaneously. win.refresh is
// exposed so refreshAfterFS() (elsewhere) can tell this specific window to redraw after an FS change.
function buildFilesApp(win, startId){
  win.appName='Files';
  let cwd=startId||'desktop';
  let view=FS.getMeta('filesView','icon');
  const history=[cwd]; let hpos=0;
  const root=el('div','flexcol'); win.body.appendChild(root);
  root.innerHTML=
    '<div class="toolbar">'+
      '<button class="tbtn icon" data-a="back">◀</button>'+
      '<button class="tbtn icon" data-a="fwd">▶</button>'+
      '<div style="flex:1;display:flex;align-items:center;gap:6px">'+
        '<button class="tbtn icon" data-a="up">⤴</button>'+
        '<span id="fpath" style="font-size:12px;color:#555;font-weight:600"></span>'+
      '</div>'+
      '<span id="fempty" style="display:none"><button class="tbtn" data-a="empty" style="color:#c44;font-weight:600">Empty Trash</button></span>'+
      '<button class="tbtn icon" data-a="iview" title="Icon view">▦</button>'+
      '<button class="tbtn icon" data-a="lview" title="List view">☰</button>'+
      '<input id="fsearch" placeholder="Search" style="width:120px;padding:5px 9px;border:1px solid #ccc;border-radius:13px;font-size:12px;outline:none">'+
    '</div>'+
    '<div style="flex:1;display:flex;min-height:0">'+
      '<div id="fsidebar" style="width:160px;flex:0 0 160px;background:#ededf0;border-right:1px solid #d7d7da;overflow:auto;padding:10px 8px;font-size:13px"></div>'+
      '<div id="fmain" style="flex:1;overflow:auto;position:relative;background:#fff"></div>'+
    '</div>'+
    '<div style="flex:0 0 auto;padding:4px 12px;background:#f3f3f5;border-top:1px solid #ddd;font-size:11px;color:#777" id="fstatus"></div>';

  const main=$('#fmain',root), pathEl=$('#fpath',root), status=$('#fstatus',root), sidebar=$('#fsidebar',root);

  // buildSidebar : redraws the favorites list, highlighting whichever favorite matches the current folder.
  function buildSidebar(){
    const favs=[['desktop','🖥','Desktop'],['documents','📄','Documents'],['downloads','⤓','Downloads'],['applications','📦','Applications'],['pictures','🖼','Pictures'],['music-folder','🎵','Music'],['trash','🗑','Trash'],['root','💽','Internal Disk']];
    sidebar.innerHTML='<div style="font-size:11px;color:#999;font-weight:700;margin:2px 4px 6px">FAVORITES</div>'+
      favs.map(f=>'<div class="fav" data-id="'+f[0]+'" style="display:flex;gap:8px;padding:5px 8px;border-radius:6px;cursor:default;align-items:center'+(f[0]===cwd?';background:#d3d8e0':'')+'"><span>'+f[1]+'</span><span>'+f[2]+'</span></div>').join('');
    $$('.fav',sidebar).forEach(f=>f.onclick=win.guard(()=>navigate(f.dataset.id)));
  }

  // navigate : changes the current folder and pushes it onto this window's back/forward history,
  // unless noHist is set (used by the back/forward buttons themselves, which move hpos without
  // adding a new history entry).
  function navigate(id,noHist){
    cwd=id;
    if(!noHist){ history.splice(hpos+1); history.push(id); hpos=history.length-1; }
    render();
  }
  win.refresh=()=>render();

  // render : redraws everything below the toolbar for the current folder — sidebar highlight, the
  // Trash-only "Empty Trash" button, and the item listing itself (icon grid or detail list, per
  // `view`), filtered by the search box if it has text (a non-empty search searches the whole FS via
  // FS.search rather than just the current folder, so results can come from anywhere).
  function render(){
    const folder=FS.get(cwd)||FS.get('desktop');
    cwd=folder.id;
    pathEl.textContent=FS.pathOf(cwd)==='/'?'Internal Disk':FS.pathOf(cwd);
    const emptyBtn=$('#fempty',root);
    emptyBtn.style.display=cwd==='trash'?'':'none';
    buildSidebar();
    let items=FS.children(cwd).sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):(a.type==='folder'?-1:1));
    const q=$('#fsearch',root).value.trim().toLowerCase();
    if(q)items=FS.search(q);
    main.innerHTML='';
    if(view==='icon'){
      const grid=el('div'); grid.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding:14px;align-content:flex-start';
      items.forEach(n=>grid.appendChild(fileTile(n)));
      if(!items.length)grid.innerHTML='<div style="color:#aaa;padding:30px;width:100%;text-align:center">This folder is empty</div>';
      main.appendChild(grid);
    }else{
      const list=el('div');
      list.innerHTML='<div style="display:flex;font-size:11px;color:#888;font-weight:700;padding:6px 12px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fafafa"><div style="flex:1">Name</div><div style="width:90px">Size</div><div style="width:150px">Modified</div></div>';
      items.forEach(n=>{
        const r=el('div');
        r.style.cssText='display:flex;align-items:center;padding:5px 12px;border-bottom:1px solid #f3f3f3;font-size:13px;cursor:default';
        r.innerHTML='<div style="flex:1;display:flex;gap:9px;align-items:center">'+iconHTML(n,22)+'<span>'+esc(n.name)+'</span></div><div style="width:90px;color:#888">'+(n.type==='folder'?'--':fmtSize(sizeOf(n)))+'</div><div style="width:150px;color:#888">'+fmtDate(n.modified)+'</div>';
        r.onmouseenter=()=>r.style.background='#f0f4fb'; r.onmouseleave=()=>r.style.background='';
        r.ondblclick=win.guard(()=>{ n.type==='folder'?navigate(n.id):openNode(n); });
        r.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();nodeContextMenu(n,e.clientX,e.clientY,'files');};
        r.setAttribute('draggable','true');
        r.addEventListener('dragstart',e=>{ e.dataTransfer.setData('benos/id',n.id); });
        if(n.type==='folder'){
          r.setAttribute('data-folder-id',n.id);
          r.addEventListener('dragover',e=>{ e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect='move'; r.style.background='#d0d8e8'; });
          r.addEventListener('dragleave',()=>{ r.style.background=''; });
          r.addEventListener('drop',win.guard(async e=>{
            e.preventDefault(); e.stopPropagation(); r.style.background='';
            const id=e.dataTransfer.getData('benos/id');
            if(id && id!==n.id){ await FS.move(id,n.id); render(); refreshAfterFS('desktop'); }
          }));
        }
        list.appendChild(r);
      });
      if(!items.length)list.innerHTML+='<div style="color:#aaa;padding:30px;text-align:center">This folder is empty</div>';
      main.appendChild(list);
    }
    const s=FS.children(cwd);
    status.textContent=s.length+' items'+(Clip.ids.length?'  ·  '+Clip.ids.length+' in clipboard':'');
  }

  // fileTile : builds one icon-view tile for a file/folder — same drag-and-drop and double-click/
  // right-click wiring as the list-view row above, just laid out as a vertical icon+label card instead
  // of a horizontal row.
  function fileTile(n){
    const t=el('div'); t.style.cssText='width:96px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:8px;cursor:default;text-align:center';
    t.innerHTML='<div>'+iconHTML(n,52)+'</div><div style="font-size:12px;word-break:break-word;line-height:14px;max-width:92px">'+esc(n.name)+'</div>';
    t.onmouseenter=()=>t.style.background='#eef3fc'; t.onmouseleave=()=>t.style.background='';
    t.ondblclick=win.guard(()=>{ n.type==='folder'?navigate(n.id):openNode(n); });
    t.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();nodeContextMenu(n,e.clientX,e.clientY,'files');};
    t.setAttribute('draggable','true');
    t.addEventListener('dragstart',e=>{ e.dataTransfer.setData('benos/id',n.id); });
    if(n.type==='folder'){
      t.setAttribute('data-folder-id',n.id);
      t.addEventListener('dragover',e=>{ e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect='move'; t.style.background='#d0d8e8'; });
      t.addEventListener('dragleave',()=>{ t.style.background=''; });
      t.addEventListener('drop',win.guard(async e=>{
        e.preventDefault(); e.stopPropagation(); t.style.background='';
        const id=e.dataTransfer.getData('benos/id');
        if(id && id!==n.id){ await FS.move(id,n.id); render(); refreshAfterFS('desktop'); }
      }));
    }
    return t;
  }

  // toolbar actions
  $$('[data-a]',root).forEach(b=>b.onclick=win.guard(()=>{
    const a=b.dataset.a;
    if(a==='back'&&hpos>0){hpos--;navigate(history[hpos],true);}
    else if(a==='fwd'&&hpos<history.length-1){hpos++;navigate(history[hpos],true);}
    else if(a==='up'){ const p=FS.get(cwd); if(p&&p.parentId)navigate(p.parentId); }
    else if(a==='iview'){ view='icon'; FS.setMeta('filesView','icon'); render(); }
    else if(a==='lview'){ view='list'; FS.setMeta('filesView','list'); render(); }
    else if(a==='empty'){ emptyTrash(); render(); }
  }));
  $('#fsearch',root).addEventListener('input',()=>render());

  // empty-area context menu (paste / new)
  main.addEventListener('contextmenu',e=>{ if(e.target.closest('[draggable]')||e.target.closest('[style*="cursor:default"]'))return; });
  main.addEventListener('contextmenu',e=>{
    if(e.target!==main && !e.target.closest('#fmain'))return;
    if(e.target.closest('div[draggable]'))return;
    // only when clicking blank space
    let blank=true; let p=e.target; while(p&&p!==main){ if(p.getAttribute&&p.getAttribute('draggable')){blank=false;break;} p=p.parentElement; }
    if(!blank)return;
    e.preventDefault();e.stopPropagation();
    showCtx(e.clientX,e.clientY,[
      {label:'New Folder',action:()=>quickNewFolder(cwd)},
      {label:'New File',action:()=>quickNewFile(cwd)},
      {sep:true},
      {label:'Paste',action:()=>pasteInto(cwd),disabled:!Clip.ids.length},
      {label:'Import from Computer…',action:()=>pickFiles(cwd)},
      {sep:true},
      {label:'Get Info',action:()=>showProperties(FS.get(cwd))},
    ]);
  });

  // drag&drop: internal move + external import
  main.addEventListener('dragover',e=>{ e.preventDefault();e.dataTransfer.dropEffect='copy'; });
  main.addEventListener('drop',win.guard(async e=>{
    e.preventDefault();
    const folderTile=e.target.closest('[data-folder-id]');
    if(folderTile)return;
    const innerId=e.dataTransfer.getData('benos/id');
    if(innerId){ await FS.move(innerId,cwd); render(); refreshAfterFS('desktop'); return; }
    if(e.dataTransfer.files&&e.dataTransfer.files.length){ await importFiles(e.dataTransfer.files,cwd); render(); }
  }));

  render();
}
// pickFiles : opens the browser's native file-picker dialog (a hidden <input type=file>) and imports
// whatever the user selects into parentId — used by the Files app's "Import from Computer…" menu item.
function pickFiles(parentId){
  const inp=el('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=()=>{ if(inp.files.length)importFiles(inp.files,parentId); };
  inp.click();
}
/* ===================================================================== */
/* PREINSTALLED APP — SETTINGS                                             */
/* ===================================================================== */
// buildSettingsApp : System Preferences-style app with a left-side tab list (Wallpaper/Dock/Users/
// Storage/System) and a right-side content pane that swaps per tab. Each tab's content is built by
// its own renderX() function further down (renderWall/renderDock/renderUsers/renderStorage/renderSystem).
function buildSettingsApp(win){
  win.appName='Settings';
  const root=el('div','flexcol'); win.body.appendChild(root);
  root.style.flexDirection='row';
  const tabs=['Wallpaper','Dock','Users','Storage','System'];
  let active='Wallpaper';
  root.innerHTML='<div id="setnav" style="width:170px;flex:0 0 170px;background:#ededf0;border-right:1px solid #d7d7da;padding:12px 8px"></div><div id="setbody" style="flex:1;overflow:auto;padding:22px 26px"></div>';
  const nav=$('#setnav',root), body=$('#setbody',root);
  const icons={Wallpaper:'🖼',Dock:'⭐',Users:'👤',Storage:'💾',System:'💻'};
  // renderNav : redraws the tab list, highlighting the active tab and wiring clicks to switch tabs.
  function renderNav(){
    nav.innerHTML=tabs.map(t=>'<div class="snav" data-t="'+t+'" style="display:flex;gap:9px;padding:8px 10px;border-radius:7px;cursor:default;font-size:13px;align-items:center'+(t===active?';background:var(--accent);color:#fff':'')+'"><span>'+icons[t]+'</span>'+t+'</div>').join('');
    $$('.snav',nav).forEach(s=>s.onclick=win.guard(()=>{active=s.dataset.t;renderNav();renderBody();}));
  }
  // card : shared visual wrapper (white rounded box + heading) used by every settings section so all
  // tabs look consistent without repeating the same markup everywhere.
  function card(title,inner){ return '<div class="set-card" style="background:#fff;border:1px solid #e3e3e6;border-radius:10px;padding:18px;margin-bottom:16px"><h3 style="font-size:14px;margin-bottom:12px">'+title+'</h3>'+inner+'</div>'; }
  // renderBody : dispatches to the correct tab-content renderer and replays a fade-in animation on
  // every tab switch (forcing a reflow via body.offsetWidth so re-adding the same class restarts it).
  function renderBody(){
    body.classList.remove('set-fade-in'); void body.offsetWidth; body.classList.add('set-fade-in');
    if(active==='Wallpaper')renderWall();
    else if(active==='Dock')renderDock();
    else if(active==='Users')renderUsers();
    else if(active==='Storage')renderStorage();
    else renderSystem();
  }
  // renderWall : the Wallpaper tab — shows a grid of every available wallpaper (local + remote,
  // via getWallpaperEntries) as clickable thumbnails, a text field for pasting a custom image URL, a
  // reset-to-default button, and a live monitor-shaped preview of whichever wallpaper is selected.
  // Thumbnails start as plain gray boxes and are filled in with real images asynchronously afterward
  // (fetching/decoding each cached asset takes a moment), so the grid appears instantly either way.
  async function renderWall(){
    const cur=FS.getMeta('wallpaper',null);
    const bgs=getWallpaperEntries();
    const hasOcean=bgs.some(f=>f.name==='Ocean Sky.svg' && (f.dir||'backgrounds')==='Wallpapers');
    const effective=cur||(hasOcean?assetKey('Wallpapers','Ocean Sky.svg'):null);
    let tiles;
    if(bgs.length){
      tiles=bgs.map(f=>{ const ref=assetKey(f.dir||'backgrounds',f.name); const sel=(effective===ref); const label=f.name.replace(/\.\w+$/,'');
        return '<div class="wp" data-ref="'+ref+'" title="'+esc(label)+'" style="width:132px;height:82px;border-radius:8px;background:#cfd6e0;background-size:cover;background-position:center;cursor:pointer;position:relative;border:3px solid '+(sel?'var(--accent)':'transparent')+'"><span style="position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(0,0,0,.45);color:#fff;border-radius:0 0 4px 4px;text-transform:capitalize">'+esc(label)+'</span></div>'; }).join('');
    }else{
      tiles='<div style="font-size:12px;color:#999;line-height:1.6">No wallpaper packs are downloaded yet. They come from the BenOS metadata server on boot — if it was offline, reboot while connected, or paste a custom image URL below.</div>';
    }
    body.innerHTML=card('Desktop Wallpaper <span style="font-size:11px;color:#999;font-weight:400">— from BenOS metadata</span>',
      '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px" id="wpgrid">'+tiles+'</div>'+
      '<div style="display:flex;gap:8px;margin-top:10px"><input id="wpurl" placeholder="Paste image URL…" style="flex:1;padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:12px"><button class="tbtn" id="wpset">Set</button><button class="tbtn" id="wpreset">Reset to Default (Ocean Sky)</button></div>')
      +(function(){ const sw=screen.width||window.innerWidth||1920, sh=screen.height||window.innerHeight||1080; return card('Preview <span style="font-size:11px;color:#999;font-weight:400">— '+sw+' × '+sh+' (monitor)</span>',
        '<div style="display:flex;justify-content:center"><div style="width:260px;aspect-ratio:'+sw+' / '+sh+';max-height:200px;border:6px solid #2a2a2e;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden;background:#000"><div id="wppreview" style="width:100%;height:100%;background:#cfd6e0;background-size:cover;background-position:center"></div></div></div>'); })();
    // fill thumbnails + preview from the cached binaries
    for(const f of bgs){ const ref=assetKey(f.dir||'backgrounds',f.name); const d=await assetData(ref); if(d){ const t=body.querySelector('.wp[data-ref="'+ref+'"]'); if(t)t.style.backgroundImage=wallpaperCssValue(d); } }
    resolveWallpaper(effective).then(u=>{ const p=$('#wppreview',body); if(p)p.style.backgroundImage=wallpaperCssValue(u); });
    $$('.wp',body).forEach(w=>w.onclick=win.guard(async()=>{await setWall(w.dataset.ref);}));
    $('#wpset',body).onclick=win.guard(async()=>{const u=$('#wpurl',body).value.trim();if(u)await setWall(u);});
    $('#wpreset',body).onclick=win.guard(async()=>{await setWall(null);});
  }
  // setWall : persists the chosen wallpaper reference (an asset key, a custom URL, or null to reset
  // to default), re-applies it live, and refreshes the tab so the new selection shows as checked.
  async function setWall(u){ await FS.setMeta('wallpaper',u); applyWallpaper(); playSound('change'); renderWall(); notify('Wallpaper changed','Desktop background updated','🖼'); }
  // renderDock : the Dock tab — a size slider (36-80px, live-applied via buildDock on every change)
  // and a read-only summary of which items are currently pinned.
  function renderDock(){
    const size=FS.getMeta('dockSize',52);
    body.innerHTML=card('Dock Size','<input type="range" id="dsize" min="36" max="80" value="'+size+'" style="width:100%"><div style="font-size:12px;color:#888;margin-top:6px">Current: <span id="dsv">'+size+'</span>px</div>')
      +card('Dock Items','<div style="font-size:12px;color:#888">'+FS.getMeta('dock',[]).map(id=>(FS.get(id)||{}).name||'?').join(', ')+'</div><div style="font-size:11px;color:#aaa;margin-top:8px">Tip: right-click an app and choose “Pin to Dock”, or right-click a Dock icon to remove it.</div>');
    $('#dsize',body).oninput=win.guard(async e=>{ const v=+e.target.value; $('#dsv',body).textContent=v; await FS.setMeta('dockSize',v); buildDock(); });
  }
  // renderUsers : the Users tab — lists every account with password/hint status and per-user actions
  // (change/remove password, set/edit hint, delete — delete is hidden when it's the only account left
  // since BenOS always needs at least one user), plus a form to add a new account. Edits a local deep
  // copy of the user list and only writes it back to FS meta via commit() once an action completes.
  function renderUsers(){
    const users=JSON.parse(JSON.stringify(getUsers()));
    // commit : persists the working copy of `users` back to FS metadata and re-renders the tab.
    async function commit(){ await FS.setMeta('users',users); renderUsers(); }
    body.innerHTML=card('User Accounts',
      users.map((u,i)=>'<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #eee">'+
        '<div style="font-size:28px">'+(u.avatar||'👤')+'</div>'+
        '<div style="flex:1"><div style="font-weight:600">'+esc(u.name)+(u.name===BENOS.user?' <span style="font-size:11px;color:#888;font-weight:400">(current)</span>':'')+'</div>'+
        '<div style="font-size:11px;color:#999">'+(u.pass?'🔒 Password protected':'No password')+' · '+(u.hint?'💡 Hint set':'No hint')+'</div></div>'+
        '<button class="tbtn" data-pw="'+i+'">'+(u.pass?'Change':'Set')+' Password</button>'+ 
        '<button class="tbtn" data-hint="'+i+'">'+(u.hint?'Edit':'Set')+' Hint</button>'+ 
        (u.pass?'<button class="tbtn" data-clr="'+i+'">Remove Password</button>':'')+
        (users.length>1?'<button class="tbtn" data-del="'+i+'">Delete</button>':'')+
      '</div>').join(''))
      +card('Add User','<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="nu-name" placeholder="User name" style="flex:1;min-width:120px;padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px"><input id="nu-pass" placeholder="Password (optional)" style="flex:1;min-width:120px;padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px"><input id="nu-hint" placeholder="Password hint (optional)" style="flex:1;min-width:120px;padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px"><button class="tbtn" id="nu-add">Add User</button></div>')
      +card('Login Behaviour','<div style="font-size:12px;color:#666;line-height:1.7">The login screen appears only when a password is set <b>or</b> more than one user exists. With a single password-free user, BenOS logs in automatically on boot.<br>Current state: <b>'+(needsLogin()?'Login required at startup':'Auto-login enabled')+'</b></div>');
    $$('[data-pw]',body).forEach(b=>b.onclick=win.guard(()=>{ const i=+b.dataset.pw; promptText('Set Password','Enter a new password for '+users[i].name+':','',true, async v=>{ users[i].pass=v||''; await commit(); notify('Password updated',users[i].name,'🔒'); }); }));
    $$('[data-hint]',body).forEach(b=>b.onclick=win.guard(()=>{ const i=+b.dataset.hint; promptText('Set Password Hint','Enter a password hint for '+users[i].name+':',users[i].hint||'', false, async v=>{ users[i].hint=v||''; await commit(); notify('Hint saved',users[i].name,'💡'); }); }));
    $$('[data-clr]',body).forEach(b=>b.onclick=win.guard(async()=>{ const i=+b.dataset.clr; users[i].pass=''; await commit(); }));
    $$('[data-del]',body).forEach(b=>b.onclick=win.guard(async()=>{ const i=+b.dataset.del; if(users.length<=1)return; const nm=users[i].name; users.splice(i,1); await commit(); notify('User removed',nm,'👤'); }));
    $('#nu-add',body).onclick=win.guard(async()=>{ const nm=$('#nu-name',body).value.trim(); if(!nm){return;} const pw=$('#nu-pass',body).value||''; const hint=$('#nu-hint',body).value||''; users.push({name:nm,pass:pw,hint:hint,avatar:'👤'}); await commit(); notify('User added',nm,'👤'); });
  }
  // renderStorage : the Storage tab — a usage bar against a nominal 512MB virtual quota, a
  // files/folders breakdown, and which storage backend is actually in use (with a warning if it's the
  // non-persistent in-memory fallback).
  function renderStorage(){
    const s=FS.stats(); const total=512*1048576; const pct=Math.min(100,(s.bytes/total)*100);
    const engine = DB.mode==='idb'?'IndexedDB (persistent)':(DB.mode==='local'?'localStorage (persistent, ~5 MB)':'In-memory (not saved after the page closes)');
    body.innerHTML=card('Storage',
      '<div style="height:22px;border-radius:11px;background:#e6e6ea;overflow:hidden;margin-bottom:10px"><div style="height:100%;width:'+Math.max(2,pct)+'%;background:linear-gradient(90deg,#3a86e0,#7ec5ff)"></div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:13px"><span>'+fmtSize(s.bytes)+' used</span><span style="color:#888">'+fmtSize(total-s.bytes)+' available of '+fmtSize(total)+'</span></div>')
      +card('Contents','<div style="font-size:13px;line-height:1.9"><div>📄 Files: <b>'+s.files+'</b></div><div>📁 Folders: <b>'+s.folders+'</b></div><div>💾 Total items: <b>'+(s.files+s.folders)+'</b></div></div>')
      +card('Storage Engine','<div style="font-size:13px">Backend: <b>'+engine+'</b></div>'+(DB.mode==='memory'?'<div style="font-size:11px;color:#c0392b;margin-top:6px">⚠️ Persistent storage is blocked in this context. Serve BenOS over http:// for permanent saving.</div>':''));
  }
  // renderSystem : the System tab — version/build/user/resolution/browser/storage-engine summary,
  // details of the last metadata download from GitHub (if any), the power actions (Restart/Shut Down/
  // Log Out), and the destructive factory-reset button.
  function renderSystem(){
    const s=FS.stats();
    body.innerHTML=card('About This BenOS',
      '<div style="font-size:13px;line-height:2"><div><b>BenOS HTML Edition</b></div>'+
      '<div>Version: '+BENOS.version+'</div><div>Build: '+BENOS.build+'</div><div>User: '+BENOS.user+'</div>'+
      '<div>Resolution: '+(screen.width||window.innerWidth||1920)+' × '+(screen.height||window.innerHeight||1080)+'</div>'+
      '<div>Browser: '+navigator.userAgent.split(') ')[0].split('(').pop()+'</div>'+
      '<div>Storage engine: '+(DB.mode==='idb'?'IndexedDB':(DB.mode==='local'?'localStorage':'In-memory'))+'</div></div>')
      +card('System Files (Metadata)', (function(){
        const md=FS.getMeta('systemMetadata',null);
        if(md && md.files){
          const n=Object.keys(md.files).length;
          return '<div style="font-size:13px;line-height:1.9"><div>Source: <b>github.com/'+esc('BenjaminOriginals/BenOS-HTML')+'</b></div><div>Directory: <b>/'+esc(md.version)+'/</b></div><div>Branch: <b>'+esc(md.branch)+'</b></div><div>Files downloaded: <b>'+n+'</b></div><div>Fetched: <b>'+fmtDate(md.fetchedAt)+'</b></div></div>';
        }
        return '<div style="font-size:13px;color:#888;line-height:1.7">No metadata was downloaded this session. BenOS booted from local data (the metadata repository was offline or empty). System files are fetched from <b>github.com/BenjaminOriginals/BenOS-HTML</b> at <b>/'+esc(BENOS.version)+'/</b> on boot.</div>';
      })())
      +card('Power','<div style="display:flex;gap:8px"><button class="tbtn" onclick="confirmAction(\'Restart BenOS?\',restartOS)">Restart</button><button class="tbtn" onclick="confirmAction(\'Shut down?\',shutdownOS)">Shut Down</button><button class="tbtn" onclick="confirmAction(\'Log out?\',logOut)">Log Out</button></div>')
      +card('Reset','<div style="font-size:12px;color:#666;line-height:1.6;margin-bottom:10px">Restore BenOS to factory settings. This permanently erases all files, settings, users and installed apps.</div><button class="tbtn" style="background:#ffeaea;border-color:#f3b6b6;color:#c0392b" onclick="factoryReset()">⚠️ Restore Factory Settings</button>');
  }
  renderNav(); renderBody();
}

/* ===================================================================== */
// buildTerminalApp : a small shell emulator ("bensh") over the virtual filesystem — a scrolling output
// pane plus a single input line styled to look like a real terminal prompt. `cwd` here is the
// terminal's own working directory (independent of any Files window), and `hist`/`hp` back the
// up/down-arrow command history. The actual command implementations are wired up further below this
// setup (ls/cd/cat/mkdir/etc., dispatched from whatever's typed into `inp`).
function buildTerminalApp(win){
  win.appName='Terminal';
  win.body.style.background='#1e1e1e';
  const root=el('div'); root.style.cssText='height:100%;display:flex;flex-direction:column;font-family:Menlo,Monaco,monospace;font-size:13px;color:#e6e6e6;padding:10px;overflow:hidden';
  win.body.appendChild(root);
  const out=el('div'); out.style.cssText='flex:1;overflow:auto;white-space:pre-wrap;line-height:1.45;word-break:break-word';
  const inputLine=el('div'); inputLine.style.cssText='display:flex;align-items:center;gap:6px';
  const prompt=el('span'); prompt.style.color='#5af78e';
  const inp=el('input'); inp.style.cssText='flex:1;background:transparent;border:none;outline:none;color:#e6e6e6;font-family:inherit;font-size:13px;';
  inputLine.appendChild(prompt); inputLine.appendChild(inp);
  root.appendChild(out); root.appendChild(inputLine);

  let cwd='root'; const hist=[]; let hp=0;
  const print=(t,c)=>{ const d=el('div'); if(c)d.style.color=c; d.textContent=t; out.appendChild(d); out.scrollTop=out.scrollHeight; };
  const setPrompt=()=>{ prompt.textContent='ben@benos '+(FS.pathOf(cwd)==='/'?'/':FS.pathOf(cwd))+' $'; };
  win.body.addEventListener('mousedown',()=>setTimeout(()=>inp.focus(),0));

  print('BenOS HTML Edition Terminal — type "help" for a list of commands.','#888'); print('');
  setPrompt(); setTimeout(()=>inp.focus(),60);

  function resolve(p){
    // returns node for a path (absolute or relative); null if not found
    if(!p)return FS.get(cwd);
    let base = p.startsWith('/')?'root':cwd;
    const parts=p.split('/').filter(x=>x.length);
    let cur=FS.get(base);
    for(const part of parts){
      if(part==='.')continue;
      if(part==='..'){ cur=FS.get(cur.parentId)||cur; continue; }
      const child=FS.childByName(cur.id,part);
      if(!child)return null; cur=child;
    }
    return cur;
  }
  // parentAndName : splits a path like "docs/notes.txt" into its containing folder node (resolved via
  // resolve()) and the final path segment — used by commands that need to create/write a file by path
  // (e.g. `echo text > file`) rather than open an existing one.
  function parentAndName(p){
    const parts=p.split('/').filter(x=>x.length); const name=parts.pop();
    const dir = parts.length? resolve((p.startsWith('/')?'/':'')+parts.join('/')) : FS.get(cwd);
    return {dir,name};
  }

  // cmds : the command table — each key is a command name, each value a function(args, rawLine) that
  // implements it against the virtual FS (via resolve/parentAndName/FS.*), printing output/errors with
  // `print`. Mirrors familiar POSIX shell commands (ls/cd/pwd/mkdir/touch/cat/echo/rm/cp/mv) plus a few
  // BenOS-specific ones (open, tree, neofetch). Any command that mutates the FS calls afterFS() to
  // refresh the desktop/Files windows to match.
  const cmds={
    help(){ print('Available commands:\n  help            show this help\n  ls [path]       list directory contents\n  cd <path>       change directory\n  pwd             print working directory\n  mkdir <name>    create a folder\n  touch <name>    create an empty file\n  cat <file>      print file contents\n  echo <text>     print text  (echo text > file to write)\n  rm <name>       remove a file or folder\n  cp <a> <b>      copy\n  mv <a> <b>      move/rename\n  open <name>     open a file/app in a window\n  tree            show the file tree\n  clear           clear the screen\n  whoami          current user\n  date            current date/time\n  neofetch        system info'); },
    ls(a){ const t=a[0]?resolve(a[0]):FS.get(cwd); if(!t){print('ls: no such file or directory: '+a[0],'#ff6b6b');return;} if(t.type!=='folder'){print(t.name);return;} const c=FS.children(t.id).sort((x,y)=>x.name.localeCompare(y.name)); if(!c.length){return;} print(c.map(n=>n.type==='folder'?n.name+'/':n.name).join('   ')); },
    cd(a){ if(!a[0]||a[0]==='~'){cwd='root';setPrompt();return;} const t=resolve(a[0]); if(!t){print('cd: no such directory: '+a[0],'#ff6b6b');return;} if(t.type!=='folder'){print('cd: not a directory: '+a[0],'#ff6b6b');return;} cwd=t.id; setPrompt(); },
    pwd(){ print(FS.pathOf(cwd)==='/'?'/':FS.pathOf(cwd)); },
    async mkdir(a){ if(!a[0]){print('mkdir: missing operand','#ff6b6b');return;} await FS.createFolder(cwd,a[0]); afterFS(); },
    async touch(a){ if(!a[0]){print('touch: missing operand','#ff6b6b');return;} await FS.createFile(cwd,a[0],''); afterFS(); },
    cat(a){ const t=resolve(a[0]); if(!t){print('cat: '+a[0]+': no such file','#ff6b6b');return;} if(t.type==='folder'){print('cat: '+a[0]+': is a directory','#ff6b6b');return;} print(typeof t.content==='string'&&!t.content.startsWith('data:')?t.content:'[binary file]'); },
    async echo(a,raw){ const gt=raw.indexOf('>'); if(gt>=0){ const text=raw.slice(5,gt).trim().replace(/^["']|["']$/g,''); const fname=raw.slice(gt+1).trim(); const {dir,name}=parentAndName(fname); if(!dir){print('echo: bad path','#ff6b6b');return;} const ex=FS.childByName(dir.id,name); if(ex){ex.content=text;ex.size=text.length;await FS.save(ex);}else{await FS.createFile(dir.id,name,text);} afterFS(); } else { print(a.join(' ')); } },
    async rm(a){ if(!a[0]){print('rm: missing operand','#ff6b6b');return;} const t=resolve(a[0]); if(!t){print('rm: '+a[0]+': no such file','#ff6b6b');return;} if(t.id==='root'){print('rm: cannot remove root','#ff6b6b');return;} await FS.remove(t.id); afterFS(); },
    async cp(a){ const s=resolve(a[0]); if(!s){print('cp: '+a[0]+': no such file','#ff6b6b');return;} const dst=a[1]?resolve(a[1]):null; await FS.duplicate(s.id, dst&&dst.type==='folder'?dst.id:cwd); afterFS(); },
    async mv(a){ const s=resolve(a[0]); if(!s){print('mv: '+a[0]+': no such file','#ff6b6b');return;} const dst=a[1]?resolve(a[1]):null; if(dst&&dst.type==='folder'){await FS.move(s.id,dst.id);}else if(a[1]){await FS.rename(s.id,a[1].split('/').pop());} afterFS(); },
    open(a){ const t=resolve(a[0]); if(!t){print('open: '+a[0]+': no such file','#ff6b6b');return;} openNode(t); print('Opening '+t.name+'…','#5af78e'); },
    tree(){ const lines=[]; (function walk(id,pre){ const c=FS.children(id).sort((x,y)=>x.name.localeCompare(y.name)); c.forEach((n,i)=>{ const last=i===c.length-1; lines.push(pre+(last?'└─ ':'├─ ')+n.name+(n.type==='folder'?'/':'')); if(n.type==='folder')walk(n.id,pre+(last?'   ':'│  ')); }); })(cwd,''); print(lines.join('\n')||'(empty)'); },
    clear(){ out.innerHTML=''; },
    whoami(){ print(BENOS.user); },
    date(){ print(new Date().toString()); },
    neofetch(){ const s=FS.stats(); print('       BenOS HTML Edition\n   ___   OS: BenOS '+BENOS.version+'\n  (o o)  Build: '+BENOS.build+'\n  ( - )  User: '+BENOS.user+'\n  /   \\  Files: '+s.files+'  Folders: '+s.folders+'\n         Storage: '+fmtSize(s.bytes)+'\n         Shell: bensh','#7ec5ff'); },
  };
  // afterFS : terminal-specific "FS changed" refresh — reuses the shared refreshAfterFS() and also
  // explicitly nudges every open Files window (belt-and-suspenders, since the terminal's cwd may not
  // be 'desktop' but could still be visible in an open Files window).
  function afterFS(){ refreshAfterFS(cwd); [...WM.windows.values()].forEach(w=>{if(w.systemApp==='files'&&w.refresh)w.refresh();}); }

  // Enter runs the typed line (echoing it first, like a real terminal), splitting it into a command
  // name + whitespace-separated args and looking it up in `cmds`; unknown commands print a
  // "command not found" error instead of throwing. Up/Down arrows walk the command history.
  inp.addEventListener('keydown',win.guard(async e=>{
    if(e.key==='Enter'){
      const raw=inp.value; const line=raw.trim();
      print(prompt.textContent+' '+raw);
      inp.value='';
      if(line){ hist.push(line); hp=hist.length;
        const parts=line.split(/\s+/); const cmd=parts[0]; const args=parts.slice(1);
        if(cmds[cmd]){ try{ await cmds[cmd](args,line); }catch(err){ print(cmd+': '+(err.message||err),'#ff6b6b'); } }
        else print('bensh: command not found: '+cmd,'#ff6b6b');
      }
      setPrompt();
    }else if(e.key==='ArrowUp'){ if(hp>0){hp--;inp.value=hist[hp]||'';} e.preventDefault(); }
    else if(e.key==='ArrowDown'){ if(hp<hist.length){hp++;inp.value=hist[hp]||'';} e.preventDefault(); }
  }));
}

/* ===================================================================== */
// buildBrowserApp : a tabbed web browser built entirely out of sandboxed <iframe>s (BenOS has no real
// backend/proxy of its own to fetch pages with). Each tab is one iframe; navigating loads the target
// URL through a public read-only proxy (r.jina.ai, see toEmbeddedUrl) since most real sites forbid
// being framed directly (X-Frame-Options/CSP) — a page that still refuses to load shows the
// "can't be embedded" fallback (showBlocked) with a link to open it in a real new browser tab instead.
function buildBrowserApp(win){
  win.appName='BenBrowser';
  const root=el('div','flexcol'); win.body.appendChild(root);
  root.innerHTML=
    '<div id="tabbar" style="display:flex;align-items:center;gap:2px;background:#dee1e6;padding:6px 6px 0;flex:0 0 auto;overflow-x:auto"></div>'+
    '<div class="toolbar" style="gap:6px">'+
      '<button class="tbtn icon" data-a="back">◀</button>'+
      '<button class="tbtn icon" data-a="fwd">▶</button>'+
      '<button class="tbtn icon" data-a="reload">⟳</button>'+
      '<input id="omni" placeholder="Search or type a URL" style="flex:1;padding:7px 14px;border:1px solid #ccc;border-radius:16px;font-size:13px;outline:none">'+
      '<button class="tbtn icon" data-a="ext" title="Open current page in a real browser tab">↗</button>'+
      '<button class="tbtn icon" data-a="dl" title="Downloads">⤓</button>'+
    '</div>'+
    '<div id="viewport" style="flex:1;position:relative;background:#fff;min-height:0"><div class="bb-loadbar" id="bb-load"></div></div>';
  const vp=$('#viewport',root), omni=$('#omni',root), tabbar=$('#tabbar',root);

  // The built-in start page (see startPage() below) posts a message up to this window when one of
  // its quick-link tiles is clicked, since it can't navigate the iframe directly from inside its own
  // sandboxed srcdoc — this listener catches that message and performs the actual navigation.
  window.addEventListener('message', win.guard(ev=>{
    if(!ev.data || ev.data.__benos !== true || ev.data.type !== 'browser-navigate') return;
    const url = ev.data.url;
    if(url) go(url);
  }));

  // tabs : open tabs, each {id, title, url, frame, history, hpos}. activeTab is an index into it;
  // tabSeq is an ever-incrementing counter used to hand out unique tab ids.
  let tabs=[], activeTab=0, tabSeq=0;
  // startPage : the New Tab / home page markup — a small self-contained HTML document (quick links to
  // a few sites + a test-download link) loaded via iframe.srcdoc. Its embedded script intercepts
  // clicks on the quick-link tiles and posts them up to the real navigation logic (see the message
  // listener above) instead of letting the sandboxed iframe try to navigate itself.
  function startPage(){
    return '<!DOCTYPE html><html><head><meta charset=utf-8><style>@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}body{font-family:-apple-system,sans-serif;margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef3fb,#dfe7f5);color:#333}h1{font-size:46px;margin-bottom:6px;background:linear-gradient(90deg,#4285f4,#34a853,#fbbc05,#ea4335);-webkit-background-clip:text;background-clip:text;color:transparent;animation:fu .5s ease}p{color:#888;margin-bottom:24px;animation:fu .5s ease .1s both}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:560px}.t{background:#fff;border-radius:12px;padding:16px 10px;text-align:center;text-decoration:none;color:#444;box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:13px;transition:transform .18s,box-shadow .18s;animation:fu .45s ease both}.t:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 8px 22px rgba(0,0,0,.16)}.t b{display:block;font-size:26px;margin-bottom:6px}</style></head><body><h1>BenBrowser</h1><p>Your gateway to the web inside BenOS</p><div class=g>'+
    [['🔍','Search','https://duckduckgo.com/'],['📖','Wikipedia','https://www.wikipedia.org'],['🎨','Scratch','https://scratch.mit.edu'],['🌐','Example','https://example.com'],['🐙','GitHub','https://github.com'],['📚','MDN','https://developer.mozilla.org'],['⤓','Test Download','#download']].map((t,i)=>'<a class=t style="animation-delay:'+(i*0.05)+'s" href="'+t[2]+'" data-benbrowser="'+esc(t[2])+'" target="_self"><b>'+t[0]+'</b>'+t[1]+'</a>').join('')+
    '</div><script>document.querySelectorAll("a[data-benbrowser]").forEach(a=>{a.addEventListener("click",e=>{e.preventDefault();const url=a.getAttribute("data-benbrowser");window.parent.postMessage({__benos:true,type:"browser-navigate",url},"*");});});<\/script></body></html>';
  }
  // newTab : creates a new tab's iframe (sandboxed, with just enough permissions for typical sites to
  // function — scripts/forms/popups), adds it to `tabs`, makes it the active tab, and either navigates
  // it to `url` immediately or loads the start page.
  function newTab(url){
    const id=++tabSeq;
    const frame=el('iframe'); frame.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:none;display:none';
    frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation');
    vp.appendChild(frame);
    const tab={id,title:'New Tab',url:url||'about:start',frame,history:[],hpos:-1};
    tabs.push(tab); activeTab=tabs.length-1;
    if(url)go(url); else loadStart(tab);
    renderTabs(); showActive();
    return tab;
  }
  function loadStart(tab){ tab.frame.srcdoc=startPage(); tab.title='New Tab'; tab.url='about:start'; renderTabs(); }
  // cur : the currently active tab record — shorthand used throughout instead of tabs[activeTab].
  function cur(){ return tabs[activeTab]; }
  // renderTabs : redraws the tab strip from `tabs`, highlighting the active tab and wiring each tab's
  // click-to-switch and ✕-to-close behavior, plus the trailing "+" button to open a new tab.
  function renderTabs(){
    tabbar.innerHTML='';
    tabs.forEach((t,i)=>{
      const tb=el('div'); tb.style.cssText='display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px 8px 0 0;font-size:12px;max-width:170px;cursor:default;'+(i===activeTab?'background:#fff':'background:#cdd2d9');
      tb.innerHTML='<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+esc(t.title||'Tab')+'</span><span class="x" style="opacity:.6;padding:0 2px">✕</span>';
      tb.onclick=()=>{ activeTab=i; showActive(); renderTabs(); };
      $('.x',tb).onclick=(e)=>{ e.stopPropagation(); closeTab(i); };
      tabbar.appendChild(tb);
    });
    const add=el('div'); add.textContent='+'; add.style.cssText='padding:7px 12px;cursor:default;font-size:16px;color:#555';
    add.onclick=()=>newTab(); tabbar.appendChild(add);
  }
  // closeTab : removes a tab's iframe and record; if it was the last tab, opens a fresh one instead
  // of leaving the browser with zero tabs (a browser window always has at least one tab).
  function closeTab(i){ tabs[i].frame.remove(); tabs.splice(i,1); if(!tabs.length){ newTab(); return; } activeTab=Math.max(0,activeTab-(i<=activeTab?1:0)); showActive(); renderTabs(); }
  // showActive : shows only the active tab's iframe (all others hidden via display:none — they stay
  // alive in the background rather than being torn down) and syncs the address bar to its URL.
  function showActive(){ tabs.forEach((t,i)=>t.frame.style.display=i===activeTab?'block':'none'); const t=cur(); omni.value=t.url==='about:start'?'':t.url; }
  // normalizeBrowserUrl : turns whatever the user typed into the address bar into an actual URL to
  // load — passes through recognized protocols/URLs as-is, assumes a bare "example.com"-looking string
  // is a domain (prepending https://), and otherwise treats the input as a search query.
  function normalizeBrowserUrl(input){
    let value=input.trim();
    if(!value) return 'about:start';
    if(value==='#download') return value;
    if(/^about:/i.test(value)) return value;
    if(/^https?:\/\//i.test(value)) return value;
    if(/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) return value;
    if(/^[\w.-]+(?:\.[\w.-]+)+(?:\/|$)/.test(value)) return 'https://'+value;
    return 'https://duckduckgo.com/?q='+encodeURIComponent(value);
  }
  // toEmbeddedUrl : rewrites a normal http(s) URL to load through the r.jina.ai read-only proxy, which
  // strips the target site's framing/embedding restrictions so it can actually render inside our
  // sandboxed iframe (a direct iframe src to most real websites would otherwise be blocked by their
  // own X-Frame-Options/CSP headers). Non-http(s) URLs (about:start, etc.) pass through unchanged.
  function toEmbeddedUrl(url){
    if(!url || url==='about:start') return url;
    if(!/^https?:\/\//i.test(url)) return url;
    const protocol = /^https:/i.test(url) ? 'https://' : 'http://';
    return 'https://r.jina.ai/' + protocol + url.replace(/^https?:\/\//i,'');
  }
  // go : the main navigation function — normalizes the input, updates tab/address-bar state, starts
  // the loading-bar animation, and points the iframe at the proxied URL. `t.frame.onload`/`onerror`
  // both just stop the loading bar (there's no reliable way to detect an X-Frame-Options block from
  // JS alone, so a refused embed still "finishes loading" — it just shows blank/broken content;
  // showBlocked() is used separately for cases that can be detected).
  function go(input){
    const t=cur(); let url=normalizeBrowserUrl(input);
    if(url==='#download'){ doTestDownload(); return; }
    t.url=url; omni.value=url; t.title=url==='about:start'?'New Tab':url.replace(/^https?:\/\//,'').split('/')[0];
    renderTabs();
    startLoad();
    t.frame.removeAttribute('srcdoc'); t.blocked=false;
    t.frame.onload=()=>{ finishLoad(); };
    t.frame.onerror=()=>{ finishLoad(); };
    t.frame.src=toEmbeddedUrl(url);
  }
  // Loading progress bar -------------------------------------------------
  // A cosmetic progress bar (there's no real per-byte loading progress available from a cross-origin
  // iframe) that creeps toward 90% while "loading" and snaps to 100% on the iframe's load/error event.
  const loadbar=$('#bb-load',root); let loadTimer=null;
  function startLoad(){
    if(loadTimer)clearInterval(loadTimer);
    loadbar.style.transition='none'; loadbar.style.width='0%'; loadbar.style.opacity='1';
    void loadbar.offsetWidth; loadbar.style.transition='width .3s ease';
    let p=12; loadbar.style.width=p+'%';
    loadTimer=setInterval(()=>{ p+=Math.random()*9; if(p>90)p=90; loadbar.style.width=p+'%'; },300);
  }
  function finishLoad(){
    if(loadTimer){clearInterval(loadTimer);loadTimer=null;}
    loadbar.style.width='100%';
    setTimeout(()=>{ loadbar.style.opacity='0'; setTimeout(()=>{loadbar.style.width='0%';},250); },200);
  }
  // showBlocked : replaces a tab's content with an explanatory "this site can't be embedded" page
  // (currently unused in the automatic load path since detecting an actual frame-refusal isn't
  // reliably possible from JS, but kept available/wired for any future detection path), with a link
  // to open the real site in an actual new browser tab instead.
  function showBlocked(t,url){
    try{
      t.blocked=true;
      t.frame.srcdoc='<!DOCTYPE html><body style="font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;color:#555;text-align:center;padding:30px;background:linear-gradient(160deg,#f7f9fc,#e9eef6)"><div style="font-size:50px">\u{1F512}</div><h2 style="margin:10px 0">This site can\'t be embedded</h2><p style="color:#999;max-width:440px;line-height:1.5">'+esc(url)+' refuses to load inside a frame for security (X-Frame-Options / Content-Security-Policy). This is set by the website itself \u2014 most large sites such as Google, YouTube and many others block embedding.</p><a href="'+esc(url)+'" target="_blank" rel="noopener" style="margin-top:18px;background:#4285f4;color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:600">Open in a real browser tab \u2197</a></body>';
    }catch(e){}
  }
  // doTestDownload : the "#download" special link on the start page — demonstrates the download flow
  // by generating a small SVG image on the fly and saving it into the Downloads folder via benDownload.
  async function doTestDownload(){
    // a real download saved into the BenOS Downloads folder
    const data='data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="#4285f4"/><text x="200" y="160" font-size="30" fill="white" text-anchor="middle" font-family="sans-serif">BenBrowser Download</text></svg>');
    await benDownload('benbrowser-sample.svg', data, 'image/svg+xml');
  }

  // toolbar
  $$('[data-a]',root).forEach(b=>b.onclick=win.guard(()=>{
    const a=b.dataset.a, t=cur();
    if(a==='back'){ try{t.frame.contentWindow.history.back();}catch(e){} }
    else if(a==='fwd'){ try{t.frame.contentWindow.history.forward();}catch(e){} }
    else if(a==='reload'){ if(t.url==='about:start')loadStart(t); else t.frame.src=t.frame.src; }
    else if(a==='ext'){ if(t.url&&t.url!=='about:start'){ window.open(t.url,'_blank','noopener'); notify('Opened externally',t.url,'↗'); } else playSound('alert'); }
    else if(a==='dl'){ launchSystemApp('files','downloads'); }
  }));
  omni.addEventListener('keydown',win.guard(e=>{ if(e.key==='Enter'&&omni.value.trim())go(omni.value); }));
  newTab();
}
/* Download handler used by the browser — saves into Downloads/ permanently.
   Since BenOS has no real network downloads, "downloading" just means writing the already-in-memory
   content (a data URI, typically) as a new file into the Downloads folder, then notifying the user —
   the same end result a real browser download achieves, minus any actual network transfer. */
async function benDownload(name,content,mime){
  const kind=kindFromName(name,mime);
  const f=await FS.createFile('downloads',name,content,kind);
  f.mime=mime||''; f.size=content.length; await FS.save(f);
  refreshAfterFS('downloads');
  notify('Download complete',name+' saved to Downloads','⤓');
}

// buildMusicApp : the music player app. Its library is assembled from three sources (see library()):
// tracks downloaded from the BenOS metadata repo, any audio files the user has imported into the
// virtual FS, and a single always-present synthesized demo track. autoplayNode, when passed (e.g.
// opening an audio file from Files), should start that specific track playing immediately.
function buildMusicApp(win, autoplayNode){
  win.appName='BenMusic';
  const root=el('div','flexcol'); win.body.appendChild(root);
  root.style.background='#fafafa';
  // build the library: metadata tracks (from GitHub) + imported FS audio + a synth demo
  function library(){
    const list=[];
    (META.manifest.musics||[]).forEach(f=>{ list.push({name:f.name.replace(/\.\w+$/,''),artist:'BenOS Music',art:'#6943ff',metaKey:assetKey('musics',f.name),src:null}); });
    [...FS.nodes.values()].filter(n=>n.kind==='audio'&&typeof n.content==='string'&&n.content.startsWith('data:'))
      .forEach(n=>list.push({name:n.name.replace(/\.\w+$/,''),src:n.content,artist:'Imported',art:null}));
    list.push({name:'BenOS Theme',artist:'System Sounds',src:null,art:'#fc2c55',demo:true});
    return list;
  }
  // tracks/idx : the library snapshot and the index of the currently loaded track.
  // playing/repeat : simple playback-state flags reflected in the transport button UI.
  let tracks=library(), idx=0, playing=false, repeat=false;
  // audio : the one shared <audio> element used for every real (non-demo) track — registered with
  // Audio$ so the system volume/mute controls affect it automatically.
  const audio=new Audio(); Audio$.register(audio);
  // demoCtx/demoNodes : Web Audio API state for the synthesized "BenOS Theme" demo track, which isn't
  // a real audio file at all — see playDemo() further down for how it's generated.
  let demoCtx=null, demoNodes=[];

  root.innerHTML=
    '<div style="display:flex;flex:1;min-height:0">'+
      '<div style="width:180px;flex:0 0 180px;background:#f0f0f2;border-right:1px solid #ddd;padding:14px 10px;overflow:auto">'+
        '<div style="font-weight:700;font-size:15px;margin-bottom:12px;color:#fc2c55">♫ BenMusic</div>'+
        '<div style="font-size:11px;color:#999;font-weight:700;margin:8px 4px">LIBRARY</div>'+
        '<div class="mside" style="padding:6px 8px;border-radius:6px;background:#fff;font-size:13px">🎵 Songs</div>'+
        '<div style="font-size:11px;color:#aaa;margin-top:18px;padding:0 4px;line-height:1.5">Import .mp3 files via Files or drag them onto the desktop to add them here.</div>'+
      '</div>'+
      '<div id="mlist" style="flex:1;overflow:auto"></div>'+
    '</div>'+
    '<div id="mplayer" style="flex:0 0 auto;border-top:1px solid #ddd;background:#fff;padding:12px 16px;display:flex;align-items:center;gap:16px">'+
      '<div id="mart" style="width:54px;height:54px;border-radius:8px;background:linear-gradient(160deg,#ff6a88,#fc2c55);flex:0 0 54px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff">🎵</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div id="mtitle" style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>'+
        '<div id="martist" style="font-size:11px;color:#999">—</div>'+
        '<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span id="mcur" style="font-size:10px;color:#999;width:32px">0:00</span><div id="mprog" style="flex:1;height:5px;background:#e3e3e6;border-radius:3px;cursor:default"><div id="mbar" style="height:100%;width:0;background:#fc2c55;border-radius:3px"></div></div><span id="mdur" style="font-size:10px;color:#999;width:32px">0:00</span></div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<button class="tbtn icon" data-m="prev">⏮</button>'+
        '<button class="tbtn icon" data-m="play" style="font-size:18px;width:42px">▶</button>'+
        '<button class="tbtn icon" data-m="next">⏭</button>'+
        '<button class="tbtn icon" data-m="repeat" id="mrepeat" title="Repeat">🔁</button>'+
        '<span style="font-size:14px">🔊</span><input id="mvol" type="range" min="0" max="100" value="'+Math.round(BENOS.volume*100)+'" style="width:80px">'+
      '</div>'+
    '</div>';

  const listEl=$('#mlist',root);
  // renderList : redraws the track list from a fresh library() snapshot, highlighting whichever
  // track is loaded (idx) and showing a note glyph that changes while playing.
  function renderList(){
    tracks=library();
    listEl.innerHTML='<div style="font-size:20px;font-weight:700;padding:18px 18px 8px">Songs</div>'+
      tracks.map((t,i)=>'<div class="mrow" data-i="'+i+'" style="display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid #f0f0f0;font-size:13px'+(i===idx?';background:#ffe9ef':'')+'"><div style="width:30px;height:30px;border-radius:6px;background:'+(t.art||'linear-gradient(160deg,#8e8e93,#636366)')+';display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px">'+(i===idx&&playing?'♫':'🎵')+'</div><div style="flex:1"><div style="font-weight:600">'+esc(t.name)+'</div><div style="font-size:11px;color:#999">'+esc(t.artist)+'</div></div></div>').join('');
    $$('.mrow',listEl).forEach(r=>r.ondblclick=win.guard(()=>{ idx=+r.dataset.i; play(); }));
    $$('.mrow',listEl).forEach(r=>r.onclick=()=>{ idx=+r.dataset.i; });
  }
  // fmtT : formats seconds as "M:SS" for the current-time/duration labels.
  function fmtT(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  // stopDemo : tears down the Web Audio context used for the synthesized demo track, if one is running.
  function stopDemo(){ if(demoCtx){ try{demoNodes.forEach(n=>{try{n.stop();}catch(e){}});demoCtx.close();}catch(e){} demoCtx=null;demoNodes=[]; } }
  // playDemo : "plays" the BenOS Theme demo track by literally synthesizing a short melody with the
  // Web Audio API (a fixed note sequence, one oscillator per note) rather than decoding an audio file —
  // there is no actual demo audio asset. Progress/duration are simulated with a real-time tick() loop
  // driven off performance.now() rather than any native <audio> playback events, since none exist here.
  function playDemo(){
    stopDemo();
    demoCtx=new (window.AudioContext||window.webkitAudioContext)();
    const notes=[523,587,659,698,784,659,523,587]; const dur=0.4; let t0=demoCtx.currentTime+0.05;
    const master=demoCtx.createGain(); master.gain.value=(BENOS.muted?0:BENOS.volume)*0.25; master.connect(demoCtx.destination);
    notes.forEach((f,i)=>{ const o=demoCtx.createOscillator(); const g=demoCtx.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(master); const s=t0+i*dur; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(1,s+0.03); g.gain.linearRampToValueAtTime(0,s+dur-0.03); o.start(s); o.stop(s+dur); demoNodes.push(o); });
    const total=notes.length*dur;
    // progress simulation for demo
    $('#mdur',root).textContent=fmtT(total);
    const start=performance.now();
    (function tick(){ if(!playing||!demoCtx)return; const el2=(performance.now()-start)/1000; const p=Math.min(1,el2/total); $('#mbar',root).style.width=(p*100)+'%'; $('#mcur',root).textContent=fmtT(el2); if(p>=1){ next(); return; } setTimeout(tick,60); })();
    master._m=master;
    win._demoMaster=master;
  }
  // play : loads and starts the current track (idx). If it's a metadata track whose audio hasn't
  // been downloaded yet (t.metaKey set, t.src not yet filled in), fetches/caches it first via
  // assetData — showing "Loading…"/"Downloading… try again shortly" in the artist line while that
  // happens. Demo tracks go through playDemo() instead of the real <audio> element.
  async function play(){
    const t=tracks[idx]; if(!t)return;
    $('#mtitle',root).textContent=t.name; $('#martist',root).textContent=t.artist;
    $('#mart',root).style.background=t.art||'linear-gradient(160deg,#ff6a88,#fc2c55)';
    if(t.metaKey && !t.src){
      $('#martist',root).textContent='Loading…';
      const d=await assetData(t.metaKey);
      if(!d){ $('#martist',root).textContent='Downloading… try again shortly'; playSound('alert'); return; }
      t.src=d;
    }
    playing=true; $('[data-m=play]',root).textContent='⏸'; $('#mart',root).classList.add('spin-art'); $('#mart',root).style.borderRadius='50%';
    $('#martist',root).textContent=t.artist;
    if(t.demo){ audio.pause(); playDemo(); }
    else{
      stopDemo();
      if(audio.src !== t.src) audio.src=t.src;
      audio.play().catch(()=>{});
    }
    renderList(); updateNowPlaying();
  }
  // pause : stops playback (real audio and/or the demo synth) and resets the transport UI.
  function pause(){ playing=false; $('[data-m=play]',root).textContent='▶'; $('#mart',root).classList.remove('spin-art'); $('#mart',root).style.borderRadius='8px'; audio.pause(); stopDemo(); if(win._demoMaster){try{win._demoMaster.gain.value=0;}catch(e){}} renderList(); updateNowPlaying(); }
  function toggle(){ playing?pause():play(); }
  // updateNowPlaying : publishes the current track/playing-state into the global NowPlaying object
  // (see the Control Center section) so the menu bar's Control Center can show/control playback
  // without needing a direct reference into this specific music window.
  function updateNowPlaying(){
    const t=tracks[idx]||{};
    NowPlaying.title=t.name||null; NowPlaying.artist=t.artist||null; NowPlaying.playing=playing;
    NowPlaying._toggle=toggle; NowPlaying._win=win;
    if(typeof refreshControlCenter==='function') refreshControlCenter();
  }
  // refreshLib : called after the background music download completes (see downloadMusicAssets) —
  // rebuilds the library and tries to keep the same track selected by name if it's still present.
  win.refreshLib=()=>{ const wasName=(tracks[idx]||{}).name; tracks=library(); const ni=tracks.findIndex(t=>t.name===wasName); if(ni>=0)idx=ni; renderList(); };
  // next/prev : advance the track index (wrapping around at either end) and start playing it.
  function next(){ idx=(idx+1)%tracks.length; play(); }
  function prev(){ idx=(idx-1+tracks.length)%tracks.length; play(); }

  audio.addEventListener('timeupdate',()=>{ if(!audio.duration)return; $('#mbar',root).style.width=(audio.currentTime/audio.duration*100)+'%'; $('#mcur',root).textContent=fmtT(audio.currentTime); $('#mdur',root).textContent=fmtT(audio.duration); });
  audio.addEventListener('ended',()=>{ if(repeat){ audio.currentTime=0; audio.play().catch(()=>{}); return; } notify('Playback finished',tracks[idx].name,'🎵'); next(); });
  $('#mprog',root).onclick=win.guard(e=>{ if(!audio.duration)return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; });
  function toggleRepeat(){ repeat=!repeat; const b=$('#mrepeat',root); if(b){ b.style.background=repeat?'#fc2c55':''; b.style.color=repeat?'#fff':''; b.title=repeat?'Repeat: On':'Repeat: Off'; } }

  $$('[data-m]',root).forEach(b=>b.onclick=win.guard(()=>{ const m=b.dataset.m; if(m==='play')toggle(); else if(m==='next')next(); else if(m==='prev')prev(); else if(m==='repeat')toggleRepeat(); }));
  $('#mvol',root).oninput=win.guard(e=>{ Audio$.setVolume(e.target.value/100); if(win._demoMaster){try{win._demoMaster.gain.value=BENOS.volume*0.25;}catch(e2){}} });

  const oldClose=win.onClose; win.onClose=()=>{ pause(); Audio$.elements.delete(audio); if(oldClose)oldClose(); };

  renderList();
  if(autoplayNode){ const i=tracks.findIndex(t=>t.name===autoplayNode.name.replace(/\.\w+$/,'')); if(i>=0){idx=i;play();} }
}

// buildHealthApp : a fitness/health-tracking dashboard (water/sleep/steps) with progress rings and a
// 7-day history chart. There's no real sensor data source, so all metrics are manually adjustable by
// the user and persisted per-day in FS metadata; a new day (or first run) seeds a plausible-looking
// randomized 7-day history so the chart isn't empty on first use.
function buildHealthApp(win){
  win.appName='BenHealth';
  const root=el('div'); root.style.cssText='height:100%;overflow:auto;background:#f2f3f5;padding:18px';
  win.body.appendChild(root);
  // persisted health data
  const today=new Date().toISOString().slice(0,10);
  let data=FS.getMeta('health',null);
  if(!data || data.day!==today){
    // generate a fresh 7-day history if missing or new day
    const hist=data&&data.hist?data.hist:[];
    data={day:today, water:0, sleep:7.0, steps:0, goalWater:8, goalSteps:10000,
      hist: seedHistory()};
  }
  // seedHistory : generates a deterministic-but-varied fake 7-day history (steps/water/sleep per day)
  // using simple modular arithmetic instead of Math.random, so the "history" chart looks populated
  // and realistic without needing any real tracked data.
  function seedHistory(){
    const h=[]; const labels=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    for(let i=0;i<7;i++) h.push({d:labels[i], steps:3000+((i*2671)%7000), water:4+((i*3)%6), sleep:6+((i*7)%4)});
    return h;
  }
  // save : persists the current day's data back to FS metadata (called after every user edit).
  async function save(){ data.day=today; await FS.setMeta('health',data); }

  // ring : builds one SVG progress ring (like an Apple Watch activity ring) — a full background
  // circle plus a foreground arc whose stroke-dashoffset is set so exactly `pct` of its circumference
  // is drawn, with a percentage label in the center and a caption/value underneath.
  function ring(pct,color,label,val){
    const r=34, c=2*Math.PI*r, off=c*(1-Math.min(1,pct));
    return '<div style="text-align:center"><svg class="health-ring" width="90" height="90" viewBox="0 0 90 90"><circle cx=45 cy=45 r='+r+' fill=none stroke=#e3e3e6 stroke-width=8/><circle class="fg" style="--c:'+c+';--off:'+off+'" cx=45 cy=45 r='+r+' fill=none stroke="'+color+'" stroke-width=8 stroke-linecap=round stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 45 45)"/><text x=45 y=49 text-anchor=middle font-size=15 font-weight=700 fill=#333>'+Math.round(pct*100)+'%</text></svg><div style="font-size:12px;font-weight:600;margin-top:2px">'+label+'</div><div style="font-size:11px;color:#999">'+val+'</div></div>';
  }
  // card : shared white rounded-box wrapper for each dashboard section (same visual role as the
  // Settings app's card() helper).
  function card(inner){ return '<div class="health-card" style="background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)">'+inner+'</div>'; }

  // render : rebuilds the whole dashboard — today's progress rings (water/steps/sleep vs. goals) and
  // the 7-day history bar chart — from the current `data` state.
  function render(){
    root.innerHTML=
      '<h2 style="font-size:22px;margin-bottom:4px">Today</h2><div style="font-size:12px;color:#999;margin-bottom:16px">'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</div>'+
      card('<div style="display:flex;justify-content:space-around">'+
        ring(data.steps/data.goalSteps,'#34c759','Steps',data.steps.toLocaleString()+' / '+data.goalSteps.toLocaleString())+
        ring(data.water/data.goalWater,'#0a84ff','Water',data.water+' / '+data.goalWater+' cups')+
        ring(Math.min(1,data.sleep/8),'#5e5ce6','Sleep',data.sleep.toFixed(1)+' h')+
      '</div>')+
      card('<h3 style="font-size:14px;margin-bottom:10px">💧 Water Tracker</h3><div style="display:flex;align-items:center;gap:10px"><button class="tbtn" data-h="water-">−</button><div style="flex:1;text-align:center;font-size:24px;font-weight:700;color:#0a84ff">'+data.water+' <span style="font-size:13px;color:#999">cups</span></div><button class="tbtn" data-h="water+">+</button></div>')+
      card('<h3 style="font-size:14px;margin-bottom:10px">👟 Step Tracker</h3><div style="display:flex;align-items:center;gap:10px"><button class="tbtn" data-h="steps-">−500</button><div style="flex:1;text-align:center;font-size:24px;font-weight:700;color:#34c759">'+data.steps.toLocaleString()+'</div><button class="tbtn" data-h="steps+">+500</button></div>')+
      card('<h3 style="font-size:14px;margin-bottom:10px">😴 Sleep Tracker</h3><div style="display:flex;align-items:center;gap:10px"><button class="tbtn" data-h="sleep-">−0.5h</button><div style="flex:1;text-align:center;font-size:24px;font-weight:700;color:#5e5ce6">'+data.sleep.toFixed(1)+' h</div><button class="tbtn" data-h="sleep+">+0.5h</button></div>')+
      card('<h3 style="font-size:14px;margin-bottom:12px">📊 Weekly Steps</h3><canvas id="hchart" width="600" height="160" style="width:100%;height:160px"></canvas>')+
      card('<h3 style="font-size:14px;margin-bottom:10px">📈 Statistics</h3><div style="font-size:13px;line-height:2;color:#555"><div>Avg daily steps: <b>'+Math.round(data.hist.reduce((s,d)=>s+d.steps,0)/7).toLocaleString()+'</b></div><div>Avg sleep: <b>'+(data.hist.reduce((s,d)=>s+d.sleep,0)/7).toFixed(1)+' h</b></div><div>Avg water: <b>'+(data.hist.reduce((s,d)=>s+d.water,0)/7).toFixed(1)+' cups</b></div></div>');
    drawChart();
    $$('[data-h]',root).forEach(b=>b.onclick=win.guard(async()=>{
      const a=b.dataset.h;
      if(a==='water+')data.water++; else if(a==='water-')data.water=Math.max(0,data.water-1);
      else if(a==='steps+')data.steps+=500; else if(a==='steps-')data.steps=Math.max(0,data.steps-500);
      else if(a==='sleep+')data.sleep=Math.min(14,data.sleep+0.5); else if(a==='sleep-')data.sleep=Math.max(0,data.sleep-0.5);
      // mirror today's values into history (last entry)
      data.hist[6]={d:'Today',steps:data.steps,water:data.water,sleep:data.sleep};
      await save(); render();
    }));
  }
  // drawChart : renders the 7-day step-count history as a gradient bar chart on a <canvas>, scaling
  // bar heights against whichever is larger — the daily step goal or the tallest actual value in history.
  function drawChart(){
    const cv=$('#hchart',root); if(!cv)return; const ctx=cv.getContext('2d');
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
    const max=Math.max(10000,...data.hist.map(d=>d.steps));
    const bw=W/data.hist.length;
    data.hist.forEach((d,i)=>{
      const bh=(d.steps/max)*(H-30); const x=i*bw+bw*0.2; const y=H-20-bh;
      const grad=ctx.createLinearGradient(0,y,0,H); grad.addColorStop(0,'#34c759'); grad.addColorStop(1,'#a8e6b9');
      ctx.fillStyle=grad; ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,bw*0.6,bh,5):ctx.rect(x,y,bw*0.6,bh); ctx.fill();
      ctx.fillStyle='#999'; ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(d.d,x+bw*0.3,H-5);
    });
  }
  data.hist[6]={d:'Today',steps:data.steps,water:data.water,sleep:data.sleep};
  save();
  render();
}

// The fatal-error screen's "Restart" button just reloads the whole page — the simplest possible
// recovery from a truly unrecoverable error, since it re-runs everything from a clean slate.
$('#fatal-restart').onclick=()=>location.reload();
// Entry point: once the page has fully loaded, kick off the boot sequence. Any error thrown out of
// boot() itself (as opposed to errors during normal operation, which go through benRecoverable) is
// treated as fatal, since it means BenOS failed to even start.
window.addEventListener('load',()=>{
  // restore persisted volume after FS loads happens in boot; just kick off boot
  boot().catch(e=>benFatal(e.message||String(e)));
});
